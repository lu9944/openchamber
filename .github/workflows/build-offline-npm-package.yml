name: Build offline npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web package
        run: bun run build:web

      - name: Create npm package and offline cache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/npm-cache artifacts/package
          package_name=$(npm pack --workspace packages/web --pack-destination artifacts/package | tail -n 1)
          package_path="artifacts/package/$package_name"

          npm install \
            --global \
            --prefix "$RUNNER_TEMP/openchamber-cache-warmup" \
            --cache artifacts/npm-cache \
            "$package_path"

          npm install \
            --global \
            --prefix "$RUNNER_TEMP/openchamber-offline-test" \
            --cache artifacts/npm-cache \
            --offline \
            "$package_path"

          cat > artifacts/README.txt <<EOF
          OpenChamber offline npm package for Linux x64 and Node.js 22+

          Install from this extracted directory without network access:

            npm install --global --offline --cache ./npm-cache ./package/$package_name

          The npm cache and package tarball must remain together until installation finishes.
          EOF

      - name: Upload offline installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-npm-offline-linux-x64
          path: artifacts
          if-no-files-found: error
          retention-days: 30

