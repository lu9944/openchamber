name: Build offline npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENCHAMBER_ALLOW_SPEECH_MODEL_DOWNLOADS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify speech model downloads stay disabled
        run: bun run --cwd packages/web test -- server/lib/dictation/service.test.js

      - name: Type-check web package
        run: bun run type-check:web

      - name: Lint web package
        run: bun run lint:web

      - name: Build web package
        run: bun run build:web

      - name: Create npm package and offline cache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/npm-cache artifacts/package
          package_name=$(npm pack --workspace packages/web --pack-destination artifacts/package | tail -n 1)
          package_path="artifacts/package/$package_name"
          registry_url="https://registry.npmjs.org/"
          isolated_npmrc="$RUNNER_TEMP/openchamber-empty-npmrc"
          : > "$isolated_npmrc"

          npm install \
            --global \
            --prefix "$RUNNER_TEMP/openchamber-cache-warmup" \
            --cache artifacts/npm-cache \
            --registry "$registry_url" \
            --userconfig "$isolated_npmrc" \
            "$package_path"

          cat > artifacts/install.sh <<'INSTALL_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          artifact_dir=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)
          package_path=$(find "$artifact_dir/package" -maxdepth 1 -name 'openchamber-web-*.tgz' -print -quit)
          if [ -z "$package_path" ]; then
            echo "OpenChamber npm package was not found under $artifact_dir/package" >&2
            exit 1
          fi

          npm_args=(
            install
            --global
            --offline
            --registry=https://registry.npmjs.org/
            --userconfig="$artifact_dir/npmrc"
            --cache="$artifact_dir/npm-cache"
          )
          if [ -n "${OPENCHAMBER_INSTALL_PREFIX:-}" ]; then
            npm_args+=(--prefix="$OPENCHAMBER_INSTALL_PREFIX")
          fi

          npm "${npm_args[@]}" "$package_path"
          INSTALL_SCRIPT
          chmod +x artifacts/install.sh
          printf 'registry=https://registry.npmjs.org/\n' > artifacts/npmrc

          hostile_home="$RUNNER_TEMP/openchamber-hostile-home"
          offline_prefix="$RUNNER_TEMP/openchamber-offline-test"
          mkdir -p "$hostile_home"
          printf 'registry=https://mirrors.cloud.tencent.com/npm/\n' > "$hostile_home/.npmrc"
          HOME="$hostile_home" OPENCHAMBER_INSTALL_PREFIX="$offline_prefix" bash artifacts/install.sh
          "$offline_prefix/bin/openchamber" --help >/dev/null

          cat > artifacts/README.txt <<EOF
          OpenChamber offline npm package for Linux x64 and Node.js 22+

          Speech model downloads are disabled by default and no speech models
          are included in this artifact.

          Install from this extracted directory without network access:

            bash ./install.sh

          install.sh ignores the user's npm registry configuration so the cache
          remains usable with npm mirrors configured. The npm cache and package
          tarball must remain together until installation finishes.
          EOF

      - name: Upload offline installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-npm-offline-linux-x64
          path: artifacts
          if-no-files-found: error
          retention-days: 30
