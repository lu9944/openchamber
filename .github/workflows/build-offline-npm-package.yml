name: Build offline npm package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENCHAMBER_ALLOW_SPEECH_MODEL_DOWNLOADS: 'false'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check installer syntax
        run: bash -n scripts/install.sh

      - name: Test web package
        run: bun run --cwd packages/web test

      - name: Type-check web package
        run: bun run type-check:web

      - name: Lint web package
        run: bun run lint:web

      - name: Build web package
        run: bun run build:web

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/web/package.json').version")
          revision=${GITHUB_SHA:0:12}
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Create npm package and offline cache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/npm-cache artifacts/package
          package_name=$(npm pack --workspace packages/web --pack-destination artifacts/package | tail -n 1)
          package_path="artifacts/package/$package_name"
          expected_name="openchamber-web-${{ steps.package.outputs.version }}.tgz"
          if [ "$package_name" != "$expected_name" ]; then
            echo "Expected $expected_name, npm pack produced $package_name" >&2
            exit 1
          fi

          registry_url="https://registry.npmjs.org/"
          isolated_npmrc="$RUNNER_TEMP/openchamber-empty-npmrc"
          : > "$isolated_npmrc"

          npm install \
            --global \
            --prefix "$RUNNER_TEMP/openchamber-cache-warmup" \
            --cache artifacts/npm-cache \
            --registry "$registry_url" \
            --userconfig "$isolated_npmrc" \
            "$package_path"

          npm cache verify --cache artifacts/npm-cache

          cat > artifacts/install.sh <<'INSTALL_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          artifact_dir=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)
          hash -r 2>/dev/null || true
          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "This installer supports Linux x86_64 only." >&2
            exit 1
          fi
          if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
            echo "Node.js 22+ with npm is required." >&2
            exit 1
          fi
          node_major=$(node -p "Number(process.versions.node.split('.')[0])")
          if [ "$node_major" -lt 22 ]; then
            echo "Node.js 22+ is required; found $(node --version)." >&2
            exit 1
          fi

          package_path=$(find "$artifact_dir/package" -maxdepth 1 -name 'openchamber-web-*.tgz' -print -quit)
          if [ -z "$package_path" ]; then
            echo "OpenChamber npm package was not found under $artifact_dir/package" >&2
            exit 1
          fi
          if ! (cd "$artifact_dir" && sha256sum --check SHA256SUMS); then
            echo "Offline installer files failed integrity verification." >&2
            exit 1
          fi

          npm_args=(
            install
            --global
            --offline
            --registry=https://registry.npmjs.org/
            --userconfig="$artifact_dir/npmrc"
            --cache="$artifact_dir/npm-cache"
          )
          if [ -n "${OPENCHAMBER_INSTALL_PREFIX:-}" ]; then
            npm_args+=(--prefix="$OPENCHAMBER_INSTALL_PREFIX")
          fi

          npm "${npm_args[@]}" "$package_path"

          selected_prefix=$(printenv OPENCHAMBER_INSTALL_PREFIX || true)
          if [ -n "$selected_prefix" ]; then
            installed_bin="$selected_prefix/bin/openchamber"
          else
            installed_bin="$(npm prefix -g)/bin/openchamber"
          fi
          if [ ! -x "$installed_bin" ]; then
            echo "npm completed, but $installed_bin is missing or not executable." >&2
            exit 1
          fi

          installed_version=$("$installed_bin" --version)
          if [ "$installed_version" != "${{ steps.package.outputs.version }}" ]; then
            echo "Expected OpenChamber ${{ steps.package.outputs.version }}, installed $installed_version" >&2
            exit 1
          fi
          echo "OpenChamber $installed_version installed at $installed_bin"

          installer_home=$(printenv HOME || true)
          if [ -n "$installer_home" ]; then
            preference_dir="$installer_home/.config/openchamber"
            mkdir -p "$preference_dir"
            printf 'npm\n' > "$preference_dir/package-manager"
          fi

          if command -v openchamber >/dev/null 2>&1; then
            resolved_bin=$(command -v openchamber)
            if [ "$resolved_bin" != "$installed_bin" ]; then
              echo "Your shell currently resolves openchamber to $resolved_bin"
              echo "Run 'hash -r' after this installer exits to use $installed_bin"
            fi
          else
            echo "If openchamber was previously installed with pnpm, run 'hash -r' after this installer exits."
            echo "Make sure $(dirname "$installed_bin") is on PATH."
          fi
          INSTALL_SCRIPT
          chmod +x artifacts/install.sh
          printf 'registry=https://registry.npmjs.org/\n' > artifacts/npmrc
          (
            cd artifacts
            sha256sum "package/$package_name" npmrc install.sh > SHA256SUMS
          )

          hostile_home="$RUNNER_TEMP/openchamber-hostile-home"
          offline_prefix="$RUNNER_TEMP/openchamber-offline-test"
          mkdir -p "$hostile_home"
          printf 'registry=https://offline.invalid/\n' > "$hostile_home/.npmrc"
          HOME="$hostile_home" OPENCHAMBER_INSTALL_PREFIX="$offline_prefix" bash artifacts/install.sh
          if [ "$(cat "$hostile_home/.config/openchamber/package-manager")" != npm ]; then
            echo "Offline installer did not record npm as the update package manager." >&2
            exit 1
          fi
          npm ls --all --global --prefix "$offline_prefix"
          "$offline_prefix/bin/openchamber" --help >/dev/null

          smoke_port=39123
          smoke_log="$RUNNER_TEMP/openchamber-offline-smoke.log"
          opencode_stub="$RUNNER_TEMP/opencode-offline-smoke"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$opencode_stub"
          chmod +x "$opencode_stub"
          HOME="$hostile_home" \
            OPENCHAMBER_DATA_DIR="$RUNNER_TEMP/openchamber-offline-data" \
            OPENCHAMBER_ALLOW_SPEECH_MODEL_DOWNLOADS=false \
            OPENCODE_BINARY="$opencode_stub" \
            OPENCODE_SKIP_START=true \
            OPENCODE_HOST=http://127.0.0.1:9 \
            "$offline_prefix/bin/openchamber" serve \
              --foreground --host 127.0.0.1 --port "$smoke_port" --plain \
              >"$smoke_log" 2>&1 &
          smoke_pid=$!
          cleanup_smoke() {
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" 2>/dev/null || true
          }
          trap cleanup_smoke EXIT

          smoke_ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$smoke_port/health" >/dev/null; then
              smoke_ready=true
              break
            fi
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$smoke_ready" != true ]; then
            cat "$smoke_log" >&2
            exit 1
          fi
          curl --fail --silent "http://127.0.0.1:$smoke_port/" \
            | grep --quiet '<!doctype html>'
          cleanup_smoke
          trap - EXIT

          cat > artifacts/README.txt <<EOF
          OpenChamber ${{ steps.package.outputs.version }} offline npm package
          Source commit: $GITHUB_SHA (${{ steps.package.outputs.revision }})
          Target: Linux x86_64 with Node.js 22+ and npm

          Speech model downloads are disabled by default and no speech models
          are included in this artifact.

          Install from this extracted directory without network access:

            bash ./install.sh

          This artifact uses npm only. The installer records npm for later
          OpenChamber updates. If a previous pnpm installation was removed,
          run "hash -r" after installation so the shell forgets its old path.

          install.sh ignores the user's npm registry configuration so the cache
          remains usable with npm mirrors configured. It verifies the package
          checksum before installing. Keep install.sh, SHA256SUMS, npmrc, the
          npm-cache directory, and the package directory together.
          EOF

      - name: Upload offline installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-${{ steps.package.outputs.version }}-${{ steps.package.outputs.revision }}-npm-offline-linux-x64
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Release files
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_name="openchamber-${{ steps.package.outputs.version }}-${{ steps.package.outputs.revision }}-npm-offline-linux-x64"
          release_tag="offline-v${{ steps.package.outputs.version }}-${{ steps.package.outputs.revision }}"
          mkdir -p release-assets
          tar --create --gzip --file "release-assets/$release_name.tar.gz" --directory artifacts .
          (
            cd release-assets
            sha256sum "$release_name.tar.gz" > "$release_name.tar.gz.sha256"
          )
          cat > release-assets/release-notes.md <<EOF
          Linux x64 offline npm installation package for OpenChamber ${{ steps.package.outputs.version }}.

          The workflow tested the package with Node.js 22, installed it from an isolated npm cache with network access disabled, checked its dependency tree and CLI, then started the server and requested its health and homepage endpoints.

          Extract the archive and run `bash ./install.sh`. Speech models are not included. Providers, model catalogs, updates, relay services, and other network-backed features still need network access.

          Source commit: `$GITHUB_SHA`
          EOF
          printf "name=%s\\n" "$release_name" >> "$GITHUB_OUTPUT"
          printf "tag=%s\\n" "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish offline package to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenChamber ${{ steps.package.outputs.version }} offline npm package
          body_path: release-assets/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ steps.release.outputs.name }}.tar.gz
            release-assets/${{ steps.release.outputs.name }}.tar.gz.sha256
